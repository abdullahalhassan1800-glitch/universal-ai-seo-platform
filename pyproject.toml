[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-seo-platform"
version = "0.1.0"
description = "Universal AI SEO SaaS Platform - multi search-engine SEO intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.0",
    "playwright>=1.45.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "crawler*", "ai*", "search_engines*", "workers*", "database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
