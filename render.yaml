services:
  - type: web
    name: universal-ai-seo-api
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Universal AI SEO Platform
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        sync: false
        comment: Neon/Postgres connection string (postgresql://...?sslmode=require)
      - key: CORS_ORIGINS
        sync: false
        comment: Frontend URL, e.g. https://universal-ai-seo-platform.vercel.app
      - key: AI_PROVIDER
        value: none
      - key: CRAWLER_RENDER
        value: httpx
      - key: CRAWLER_MAX_PAGES
        value: "100"
      - key: CRAWLER_DELAY
        value: "0.3"
